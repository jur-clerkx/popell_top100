{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% block title %}{{ hitlist.name }} - Nummer toegevoegd{% endblock %}
{% block content %}
    <div class="flex flex-col items-center text-center py-4">
        <div class="w-14 h-14 rounded-full bg-emerald-500/20 border-2 border-emerald-400 text-emerald-400 flex items-center justify-center text-2xl font-bold mb-4">
            ✓
        </div>
        <h1 class="font-rock text-3xl sm:text-4xl text-white font-bold uppercase tracking-wide mb-2">Je nummer is toegevoegd!</h1>
        <p class="text-stone-300 text-base mb-6">Je kunt nu deze pagina sluiten en het nummer opzoeken in het stemformulier.</p>
        <a class="btn-tactile-amber px-8 py-3.5 text-lg" href="javascript:close()">Sluit pagina</a>
    </div>
{% endblock %}
